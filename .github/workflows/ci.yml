name: CleanHome CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Build and PostgreSQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cleanhome_app
          POSTGRES_PASSWORD: cleanhome_ci_test_only
          POSTGRES_DB: cleanhome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanhome_app -d cleanhome_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CLEANHOME_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=cleanhome_test;Username=cleanhome_app;Password=cleanhome_ci_test_only"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/CleanHome.slnx

      - name: Build without warnings
        run: >
          dotnet build backend/CleanHome.slnx
          --configuration Release
          --no-restore
          --warnaserror

      - name: Run unit and PostgreSQL integration tests
        run: >
          dotnet test backend/CleanHome.slnx
          --configuration Release
          --no-build
          --verbosity normal

  frontend:
    name: Frontend - Quality and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build React PWA
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1

  secrets:
    name: Security - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan files
        run: gitleaks dir . --redact --no-banner

      - name: Scan Git history
        run: gitleaks git . --redact --no-banner

  sast:
    name: Security - Semgrep OSS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Analyze source code
        run: |
          semgrep scan \
            --config auto \
            --error \
            --metrics=off \
            --exclude 'frontend/android' \
            --exclude '**/bin' \
            --exclude '**/obj' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            backend frontend/src
