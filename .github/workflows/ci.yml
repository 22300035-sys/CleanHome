name: CleanHome CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - Build and PostgreSQL Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CLEANHOME_TEST_CONNECTION_STRING: "Host=localhost;Port=55432;Database=cleanhome_test;Username=cleanhome_app;Password=cleanhome_ci_test_only"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install native PostgreSQL 18 (no containers)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18
          sudo pg_createcluster 18 cleanhome --port 55432 --start
          sudo -u postgres psql -p 55432 -v ON_ERROR_STOP=1 -c "CREATE ROLE cleanhome_app LOGIN PASSWORD 'cleanhome_ci_test_only';"
          sudo -u postgres psql -p 55432 -v ON_ERROR_STOP=1 -c "CREATE DATABASE cleanhome_test OWNER cleanhome_app;"
      - name: Restore
        run: dotnet restore backend/CleanHome.slnx

      - name: Audit backend dependencies
        shell: pwsh
        run: ./scripts/Audit-Dependencies.ps1

      - name: Build without warnings
        run: >
          dotnet build backend/CleanHome.slnx
          --configuration Release
          --no-restore
          --warnaserror

      - name: Run unit and PostgreSQL integration tests
        run: >
          dotnet test backend/CleanHome.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --logger trx
          --results-directory TestResults

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            TestResults/**/*.trx
            TestResults/nuget-audit.json
  frontend:
    name: Frontend - Quality and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build React PWA
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:e2e

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: |
            frontend/test-results/
            frontend/playwright-report/

  secrets:
    name: Security - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Install Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan files
        run: |
          mkdir -p TestResults
          gitleaks dir . --redact --no-banner --verbose --report-format json --report-path TestResults/gitleaks-files.json

      - name: Scan Git history
        if: ${{ success() || failure() }}
        run: gitleaks git . --redact --no-banner --verbose --report-format json --report-path TestResults/gitleaks-history.json

      - name: Upload redacted secret scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: TestResults/gitleaks-*.json

  sast:
    name: Security - Semgrep OSS
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Analyze source code
        run: |
          semgrep scan \
            --config p/default \
            --error \
            --metrics=off \
            --exclude 'frontend/android' \
            --exclude '**/bin' \
            --exclude '**/obj' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            backend frontend/src


